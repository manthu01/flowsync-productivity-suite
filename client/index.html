<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />
    <title>FlowSync: plan it, forge it, finish it</title>
    <meta
      name="description"
      content="FlowSync turns your to-dos into collectible task cards: priorities, moods, repeats, subtasks, live sharing with friends and a dashboard that shows what's actually moving."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlowSync" />
    <meta property="og:title" content="FlowSync: plan it, forge it, finish it" />
    <meta
      property="og:description"
      content="Forge tasks into collectible cards, share them with friends in real time and actually finish your list."
    />
    <meta name="twitter:card" content="summary" />
    <script>
      // Applied before anything renders so there's no flash of the wrong theme
      // on load. ThemeContext takes over (and keeps this in sync) once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem("flowsync_theme");
          document.documentElement.setAttribute("data-theme", stored === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
